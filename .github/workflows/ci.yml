name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels only. Every number in the README is reproducible without a GPU,
          # and pulling the default CUDA build would add gigabytes to every CI run.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check neuralmesh tests examples

      - name: Format check
        run: ruff format --check neuralmesh tests examples

      - name: Test
        run: pytest -q --cov=neuralmesh --cov-report=term-missing

      # The solver is ground truth for every learned number in this repository, so its
      # verification runs as a separate step. If this fails, no other result means
      # anything, and it should be obvious from the job list which one broke.
      - name: Verify the finite element solver
        run: neuralmesh verify

      - name: Smoke-test the study end to end
        if: matrix.python-version == '3.12'
        run: python examples/run_underreach.py --quick --out /tmp/results
